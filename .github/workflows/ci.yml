name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve]"
          python -m spacy download en_core_web_sm
          python -c "import nltk; [nltk.download(p) for p in ('stopwords', 'wordnet', 'omw-1.4')]"
      - name: "Tests (los que necesitan el dataset se saltan porque no se versiona)"
        run: python -m pytest -q --cov=src/hatedet --cov-report=term-missing
