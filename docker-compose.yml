services:
  api:
    build: .
    image: hatedet:latest
    restart: unless-stopped
    ports:
      # Solo local: expone al exterior con un proxy inverso HTTPS (ver deploy/Caddyfile). El puerto del HOST se
      # cambia con HATEDET_API_PORT si el 8000 ya esta ocupado; dentro del contenedor sigue siendo el 8000.
      - "127.0.0.1:${HATEDET_API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
      - review-data:/app/review   # unico punto escribible: cola de revision (ver HATEDET_REVIEW_DB)
    environment:
      HATEDET_MODEL_PATH: ${HATEDET_MODEL_PATH:-models/ensemble_v1.joblib}
      HATEDET_API_KEY: ${HATEDET_API_KEY:-}
      HATEDET_CORS_REGEX: ${HATEDET_CORS_REGEX:-^(chrome-extension://.*|https?://(localhost|127\.0\.0\.1)(:\d+)?)$$}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      HATEDET_MAX_MONITORS: ${HATEDET_MAX_MONITORS:-5}
      # Vacio = cola de revision apagada. Para activarla: HATEDET_REVIEW_DB=/app/review/review.db
      HATEDET_REVIEW_DB: ${HATEDET_REVIEW_DB:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  ui:
    image: hatedet:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HATEDET_UI_PORT:-8501}:8501"   # idem: HATEDET_UI_PORT si el 8501 esta ocupado
    environment:
      HATEDET_API_URL: http://api:8000
    command: ["streamlit", "run", "src/hatedet/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    read_only: true
    tmpfs:
      - /tmp
      - /home/appuser/.streamlit
    security_opt:
      - no-new-privileges:true

volumes:
  review-data:   # persiste la cola de revision entre reinicios; contiene texto de comentarios (RGPD)
